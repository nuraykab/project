<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Спасибо за регистрацию!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/images/techlab-favicon.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f9fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      flex-direction: column;
      text-align: center;
      padding: 20px;
    }

    .thanks-box {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 480px;
    }

    h1 {
      color: #2e73d3;
      margin-bottom: 16px;
    }

    p {
      font-size: 18px;
      color: #444;
      margin-bottom: 30px;
    }

    a.button {
      display: inline-block;
      background-color: #2e73d3;
      color: #fff;
      padding: 12px 24px;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.3s ease;
    }

    a.button:hover {
      background-color: #205bb0;
    }

    .icon {
      font-size: 48px;
      color: #2ecc71;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="thanks-box">
    <div class="icon"><i class="fa-solid fa-circle-check"></i></div>
    <h1>Спасибо за вашу заявку!</h1>
    <p>Мы свяжемся с вами в ближайшее время, чтобы подтвердить регистрацию.</p>
    <a class="button" href="index.html">Вернуться на главную</a>
  </div>
</body>
</html>
